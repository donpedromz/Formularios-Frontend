<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Formulario de registro</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="registro/estilos.css" />
    <style>
      .intro {
        margin: 0 0 1.5rem;
        color: var(--texto-suave);
      }

      .opciones {
        display: grid;
        gap: 0.75rem;
      }

      .opciones a {
        display: block;
        padding: 0.9rem 1rem;
        color: var(--texto);
        text-decoration: none;
        border: 1px solid var(--borde);
        border-radius: var(--radio);
        font-weight: 600;
      }

      .opciones a:hover {
        border-color: var(--primario);
        background: #f5f8ff;
      }

      .opciones a:focus-visible {
        outline: 3px solid var(--primario);
        outline-offset: 2px;
      }

      .opciones span {
        display: block;
        margin-top: 0.2rem;
        color: var(--texto-suave);
        font-size: 0.9rem;
        font-weight: 400;
      }
    </style>
  </head>
  <body>
    <main class="contenedor">
      <h1>Formulario de registro</h1>
      <p class="intro">Elige una de las dos versiones.</p>

      <nav class="opciones">
        <a href="registro/">
          Versión completa
          <span
            >Validación con JavaScript, mensajes de error, envío con fetch y
            teléfonos dinámicos.</span
          >
        </a>
        <a href="nativo/">
          Validación del navegador
          <span
            >La misma base del formulario validada solo con atributos
            HTML.</span
          >
        </a>
      </nav>
    </main>
  </body>
</html>
