<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registro</title>
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <form
      id="registro"
      action="https://jsonplaceholder.typicode.com/posts"
      method="post"
      novalidate
    >
      <label for="nombre">Nombre completo</label>
      <input
        id="nombre"
        name="nombre"
        type="text"
        required
        minlength="3"
        maxlength="60"
        autocomplete="name"
      />
      <label for="email">Correo</label>
      <input
        id="email"
        name="email"
        type="email"
        required
        autocomplete="email"
      />
      <!-- TODO: password con minlength="8" y pattern (letra + número) -->
      <!-- TODO: confirmar contraseña -->
      <!-- TODO: edad: type="number", min, max, step="1" -->
      <!-- TODO: país: <select required> con una primera opción vacía value="" -->
      <!-- TODO: términos: checkbox required -->
      <button type="submit">Crear cuenta</button>
      <p id="mensaje" role="status"></p>
    </form>
    <script src="app.js"></script>
  </body>
</html>
