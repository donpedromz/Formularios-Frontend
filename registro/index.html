<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Registro de usuario</title>
    <link rel="icon" href="data:," />
    <link rel="stylesheet" href="estilos.css" />
  </head>
  <body>
    <main class="contenedor">
      <h1>Crear cuenta</h1>

      <form
        id="registro"
        action="https://jsonplaceholder.typicode.com/posts"
        method="post"
        novalidate
      >
        <div class="campo">
          <label for="nombre">Nombre completo</label>
          <input
            id="nombre"
            name="nombre"
            type="text"
            required
            minlength="3"
            maxlength="60"
            autocomplete="name"
            aria-describedby="nombre-error"
          />
          <p id="nombre-error" class="error" aria-live="polite"></p>
        </div>

        <div class="campo">
          <label for="email">Correo</label>
          <input
            id="email"
            name="email"
            type="email"
            required
            autocomplete="email"
            aria-describedby="email-error"
          />
          <p id="email-error" class="error" aria-live="polite"></p>
        </div>

        <div class="campo">
          <label for="password">Contraseña</label>
          <input
            id="password"
            name="password"
            type="password"
            required
            minlength="8"
            maxlength="64"
            pattern="(?=.*[A-Za-z])(?=.*\d).{8,}"
            autocomplete="new-password"
            aria-describedby="password-error"
          />
          <p id="password-error" class="error" aria-live="polite"></p>
        </div>

        <div class="campo">
          <label for="confirmar">Confirmar contraseña</label>
          <input
            id="confirmar"
            name="confirmar"
            type="password"
            required
            minlength="8"
            maxlength="64"
            autocomplete="new-password"
            aria-describedby="confirmar-error"
          />
          <p id="confirmar-error" class="error" aria-live="polite"></p>
        </div>

        <div class="campo">
          <label for="edad">Edad</label>
          <input
            id="edad"
            name="edad"
            type="number"
            required
            min="18"
            max="120"
            step="1"
            inputmode="numeric"
            aria-describedby="edad-error"
          />
          <p id="edad-error" class="error" aria-live="polite"></p>
        </div>

        <div class="campo">
          <label for="pais">País</label>
          <select id="pais" name="pais" required aria-describedby="pais-error">
            <option value="">Elige un país</option>
            <option value="colombia">Colombia</option>
            <option value="mexico">México</option>
            <option value="argentina">Argentina</option>
            <option value="chile">Chile</option>
            <option value="peru">Perú</option>
            <option value="espana">España</option>
            <option value="estados-unidos">Estados Unidos</option>
          </select>
          <p id="pais-error" class="error" aria-live="polite"></p>
        </div>

        <fieldset class="campo">
          <legend>Teléfonos (opcional, máximo 3)</legend>
          <div id="telefonos"></div>
          <button type="button" id="agregar-telefono" class="secundario">
            Agregar teléfono
          </button>
        </fieldset>

        <div class="campo campo-checkbox">
          <input
            id="terminos"
            name="terminos"
            type="checkbox"
            required
            aria-describedby="terminos-error"
          />
          <label for="terminos">Acepto los términos y condiciones</label>
          <p id="terminos-error" class="error" aria-live="polite"></p>
        </div>

        <button type="submit">Crear cuenta</button>

        <p id="mensaje" role="status"></p>
        <p id="saludo" role="status"></p>
      </form>
    </main>

    <script type="module" src="app.js"></script>
  </body>
</html>
